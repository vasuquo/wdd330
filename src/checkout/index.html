<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="so-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form action="">
          <label for="fname">First Name
            <input type="text" name="fname" title="First Name" required>
          </label>
          <label for="lname">Last Name
            <input type="text" name="lname" title="Last Name" required>
          </label>
          <label for="address">Shipping Address
            <input type="text" name="address" title="Shipping Address" required>
          </label>
          <label for="city">City
            <input type="text" name="city" title="City" required>
          </label>
          <label for="state">State
            <input type="text" name="state" title="State" required>
          </label>
          <label for="zipcode">Zip Code
            <input type="text" name="zipcode" title="Zip Code" required>
          </label>
          <fieldset>
            <legend>Payment</legend>
            <label for="cardno">Credit Card Number
             <input type="number" name="cardno" title="Credit Card Number" required>
            </label>
            <label for="expdate">Expiration Date
             <input type="date" name="expdate" title="Expirartion Date" required>
          </label>
          <label for="scode">Security Code
            <input type="number" name="scode" title="Security Code" required>
          </label>

          </fieldset>
        </form>
      </section>
    </main>

    <footer id="so-footer"></footer>
  </body>
</html>
